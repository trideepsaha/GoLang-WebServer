<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101827" />
    <title>Say Hello</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f4f7fb;
            background: #101827;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            background:
                radial-gradient(ellipse at 15% 15%, rgb(56 189 248 / 18%), transparent 38%),
                radial-gradient(ellipse at 90% 85%, rgb(139 92 246 / 20%), transparent 35%),
                #101827;
        }

        .card {
            width: min(100%, 520px);
            padding: clamp(28px, 7vw, 48px);
            border: 1px solid rgb(255 255 255 / 12%);
            border-radius: 24px;
            background: rgb(23 33 51 / 88%);
            box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
            backdrop-filter: blur(16px);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #7dd3fc;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -0.05em;
        }

        .intro {
            margin: 12px 0 30px;
            color: #aab6c8;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 20px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            color: #e2e8f0;
            font-size: 0.92rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0 15px;
            border: 1px solid #344258;
            border-radius: 12px;
            outline: none;
            background: #111b2b;
            color: #f4f7fb;
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input::placeholder {
            color: #718096;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgb(56 189 248 / 15%);
        }

        button {
            min-height: 52px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(110deg, #38bdf8, #818cf8);
            color: #0b1220;
            cursor: pointer;
            font: inherit;
            font-weight: 750;
            transition: transform 160ms ease, filter 160ms ease;
        }

        button:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        button:focus-visible {
            outline: 3px solid #f4f7fb;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">A little introduction</p>
        <h1>Let's connect.</h1>
        <p class="intro">Drop your details below and we'll be in touch. It only takes a moment.</p>

        <form action="/form" method="post">
            <div class="field">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required />
            </div>
            <div class="field">
                <label for="address">Your address</label>
                <input type="text" id="address" name="address" placeholder="Where can we reach you?" autocomplete="street-address" required />
            </div>
            <button type="submit">Send my details <span aria-hidden="true">→</span></button>
        </form>
    </main>
</body>
</html>
